# Continuous integration — the quality gate for every push and pull request
# (PLAN §12/§13). It runs on CI exactly the checks the README asks of a developer
# locally (`cargo fmt`, `cargo clippy -D warnings`, `cargo test`) and adds the
# supply-chain audit (`cargo deny` + `cargo audit`) that guards a dependency tree
# clecta did not write a line of. Nothing here builds a release artifact: this is
# about keeping `main` green on *both* shipped targets, not about publishing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per branch/PR: a new push cancels the previous, still-running job
# for the same ref rather than burning minutes on a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repo. No token write scope is needed.
permissions:
  contents: read

# The crate is `desktop/`, not the repo root (PLAN §5) — the root is reserved for a
# second front end. This covers every `run:` step; the two actions that need the path
# instead (rust-cache, cargo-deny) are told separately, below.
#
# Every job's Rust is the one `desktop/rust-toolchain.toml` pins, installed by
# `rustup toolchain install` from that file (PLAN §3): the same Rust as every local build
# and the pre-push hook, so a newer stable cannot fail here what passed there.
defaults:
  run:
    working-directory: desktop

jobs:
  # ── Formatting ──────────────────────────────────────────────────────────────
  # rustfmt is platform-independent and compiles nothing, so it runs once on the
  # cheapest runner. `--check` fails rather than rewrites.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  # ── Windows (the primary target) ────────────────────────────────────────────
  # windows-latest is x86_64, i.e. our `x86_64-pc-windows-msvc` target natively, so
  # clippy and the tests run with no cross-compile. This is the build the portable
  # clecta.exe ships from.
  windows:
    name: clippy + test (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # Cache the registry and target dir keyed on the lockfile, so a run that does
      # not touch dependencies re-uses the previous compile. Worth more here than in
      # most projects: iced and wgpu are the bulk of a cold build.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The format probe (PLAN Q72): ffmpeg makes a file of each container and codec the app
      # plays, and of the shapes that have broken it, and each must agree with itself on its
      # length, its decode and where its seeks land. Here because the tests just built it.
      - run: choco install ffmpeg --no-progress -y
      - run: sh scripts/probe-formats.sh
        shell: bash

  # ── macOS (the second target) ───────────────────────────────────────────────
  # GitHub's macOS runners are Apple Silicon, but clecta ships for Intel
  # (`x86_64-apple-darwin`, PLAN §1). So clippy runs *against the Intel target* — a
  # cross-compile that proves the shipped target builds clean — while the tests run
  # natively on aarch64. Everything under test is pure logic with no architecture in
  # it (PLAN §12), so a native run validates it without Rosetta.
  macos:
    name: clippy (x86_64-apple-darwin) + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo clippy --all-targets --target x86_64-apple-darwin -- -D warnings
      - run: cargo test

  # ── Supply chain ────────────────────────────────────────────────────────────
  # Audited from the committed Cargo.lock, which is platform-independent, so this runs
  # once on Linux and compiles nothing. The two tools split the work:
  #   * cargo-deny  — licenses (the allow-list in desktop/deny.toml), banned crates
  #     (no `cc`: no C toolchain, PLAN §11), and unknown sources. NOT advisories.
  #   * cargo-audit — the RustSec advisory scan. Owning advisories here keeps
  #     deny.toml about policy and stops the same database being scanned twice.
  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: desktop/Cargo.toml
          command: check bans licenses sources
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # No `--ignore` list, unlike cmote's, because clecta's tree has no vulnerability to
      # accept. Six crates are flagged, all transitive through iced: *unmaintained* `paste`,
      # `ttf-parser` and three of the zbus family (Linux only, so built for no shipped
      # target), and *unsound* `lru` under iced's text renderer. cargo-audit exits 0 on
      # warnings, so they are printed and the build stays green. That is the behaviour we
      # want: none is a vulnerability and none is ours to replace, but
      # silencing them by ID would also hide the day one turns into something real. No
      # `--deny warnings` for the same reason in reverse: it would fail every build over
      # a dependency we do not control.
      - run: cargo audit
      # The vendored crates (PLAN Q69, Q71, Q72, Q73) are their published releases plus patched
      # files whose every change is marked `clecta patch`; the script says how it checks.
      - name: vendored crates are their published releases plus marked patches
        run: sh scripts/check-vendor.sh
