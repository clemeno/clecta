[package]
name = "clecta"
version = "0.1.0"
edition = "2024"
# MIT, matching the LICENSE file at the repo root. Declared here too so the crate
# carries a valid SPDX license: `cargo deny check licenses` (PLAN §12) flags any
# package with no license, and that includes our own.
license = "MIT"

[dependencies]
anyhow = "1.0.104"
# GUI (PLAN §6, §9). Default features give the wgpu renderer with a tiny-skia fallback,
# which is what keeps the "runs on a machine with no GPU driver worth the name" property.
# `smol` is not a runtime we write against — it is the only way to get a *timer*: iced's
# default `thread-pool` backend ships an empty `time` module, so `time::every` (the 20 Hz
# playhead tick, PLAN §4) does not exist without it. smol is the smaller of the two
# offered; tokio would pull far more for the same one function.
# `advanced` exposes the `Widget` trait the waveform implements (PLAN §14). It is a feature
# toggle on crates already in the tree, not a new dependency: nothing is added to
# Cargo.lock by turning it on, which is why the waveform costs no supply chain (PLAN §12).
iced = { version = "0.14.0", features = ["smol", "advanced"] }
# Watching the shown folder (PLAN §9). The OS tells us: FSEvents on macOS,
# ReadDirectoryChangesW on Windows — no polling, so nothing runs while nothing changes.
# Default features are the macOS backend; Windows needs none. Pure Rust on both, so the
# no-C-toolchain property (PLAN §11) holds.
notify = "8.2.0"
# Native folder picker (PLAN §3). NSOpenPanel / Win32, same crate as cmote.
rfd = "0.17.2"
# Audio output, mixing and decoding (PLAN §7, §8). Wraps `cpal` for the device and its
# real-time callback thread, and `symphonia` for demux + decode. Default features already
# give flac / mp3 / mp4-aac / vorbis / wav; `symphonia-mkv` adds Matroska, which is what
# makes `.mkv` and `.webm` playable (PLAN §3). Pure Rust top to bottom — cpal binds
# CoreAudio / WASAPI through `objc2` / `windows-sys` — so the no-C-toolchain portable
# build holds (PLAN §11).
rodio = { version = "0.22.2", features = ["symphonia-mkv"] }
# `clecta-data/settings.json` (PLAN §11). `derive` on one small struct, and JSON because a
# settings file someone can open in a text editor is a feature, not an accident.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Optimize the *dependencies* in a debug build, and only them. Decoding a track for its
# waveform (PLAN §14a) took 16.7 s under `cargo run` against 325 ms under `--release` —
# symphonia is arithmetic in a tight loop, and unoptimized arithmetic is 50× arithmetic.
# clecta's own code stays at opt-level 0, so it is still debuggable and still rebuilds in
# seconds; the dependencies are compiled once and cached.
[profile.dev.package."*"]
opt-level = 3

# Release profile (PLAN §11): a small, fast, self-contained portable binary.
#   lto            — link-time optimization across crates
#   codegen-units  — one unit trades build time for better optimization
#   strip          — drop symbols to shrink the binary
#   panic = abort  — no unwinding: smaller code, and a crash aborts instead of
#                    limping on (acceptable for a GUI app)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
